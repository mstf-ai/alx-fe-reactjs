<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mobile Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden pb-24">
<!-- Header Section -->
<header class="flex flex-col gap-1 px-6 pt-12 pb-4">
<div class="flex items-center justify-between">
<div>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium leading-normal">Oct 24, 2023</p>
<h1 class="text-slate-900 dark:text-white tracking-tight text-[28px] font-bold leading-tight mt-1">Hello, Alex 👋</h1>
</div>
<button class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm ring-1 ring-slate-900/5 dark:ring-white/10 transition-transform active:scale-95">
<span class="material-symbols-outlined" style="font-size: 24px;">notifications</span>
</button>
</div>
</header>
<!-- Summary Cards (Carousel) -->
<section class="w-full">
<div class="flex overflow-x-auto no-scrollbar px-6 pb-4 pt-2 gap-4 snap-x snap-mandatory">
<!-- Card 1 -->
<div class="flex flex-col justify-between min-w-[160px] h-40 bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm ring-1 ring-slate-900/5 dark:ring-white/10 snap-start">
<div class="flex items-start justify-between">
<div class="flex size-10 items-center justify-center rounded-lg bg-blue-50 dark:bg-blue-900/30 text-primary">
<span class="material-symbols-outlined">assignment</span>
</div>
</div>
<div>
<p class="text-3xl font-bold text-slate-900 dark:text-white">12</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium mt-1">Tasks Pending</p>
</div>
</div>
<!-- Card 2 -->
<div class="flex flex-col justify-between min-w-[160px] h-40 bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm ring-1 ring-slate-900/5 dark:ring-white/10 snap-start">
<div class="flex items-start justify-between">
<div class="flex size-10 items-center justify-center rounded-lg bg-green-50 dark:bg-green-900/30 text-emerald-600 dark:text-emerald-400">
<span class="material-symbols-outlined">trending_up</span>
</div>
</div>
<div>
<p class="text-3xl font-bold text-slate-900 dark:text-white">85%</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium mt-1">Weekly Goal</p>
</div>
</div>
<!-- Card 3 -->
<div class="flex flex-col justify-between min-w-[160px] h-40 bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm ring-1 ring-slate-900/5 dark:ring-white/10 snap-start">
<div class="flex items-start justify-between">
<div class="flex size-10 items-center justify-center rounded-lg bg-purple-50 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400">
<span class="material-symbols-outlined">calendar_month</span>
</div>
</div>
<div>
<p class="text-3xl font-bold text-slate-900 dark:text-white">4</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium mt-1">Meetings</p>
</div>
</div>
</div>
</section>
<!-- Tasks Header -->
<section class="px-6 pt-4 pb-2">
<div class="flex items-center justify-between">
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight">Today's Tasks</h2>
<a class="text-primary text-sm font-bold leading-normal tracking-wide flex items-center gap-1 hover:opacity-80 transition-opacity" href="#">
                    See All
                    <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</a>
</div>
</section>
<!-- Task List -->
<div class="flex flex-col gap-3 px-6 pb-6">
<!-- Task Item 1 -->
<div class="group flex items-center gap-4 bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm ring-1 ring-slate-900/5 dark:ring-white/10 transition-all hover:shadow-md">
<div class="flex size-6 shrink-0 items-center justify-center">
<input class="size-5 rounded border-slate-300 dark:border-slate-600 bg-transparent text-primary checked:bg-primary focus:ring-primary/20 dark:focus:ring-offset-slate-800 focus:ring-offset-0 cursor-pointer" type="checkbox"/>
</div>
<div class="flex flex-col flex-1 min-w-0">
<p class="text-slate-900 dark:text-white text-base font-semibold leading-snug truncate">Review Q3 Report</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium leading-normal mt-0.5">10:00 AM</p>
</div>
<div class="shrink-0">
<span class="inline-flex items-center px-2.5 py-1 rounded text-xs font-semibold bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300">
                        High
                    </span>
</div>
</div>
<!-- Task Item 2 -->
<div class="group flex items-center gap-4 bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm ring-1 ring-slate-900/5 dark:ring-white/10 transition-all hover:shadow-md">
<div class="flex size-6 shrink-0 items-center justify-center">
<input class="size-5 rounded border-slate-300 dark:border-slate-600 bg-transparent text-primary checked:bg-primary focus:ring-primary/20 dark:focus:ring-offset-slate-800 focus:ring-offset-0 cursor-pointer" type="checkbox"/>
</div>
<div class="flex flex-col flex-1 min-w-0">
<p class="text-slate-900 dark:text-white text-base font-semibold leading-snug truncate">Team Sync</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium leading-normal mt-0.5">2:00 PM</p>
</div>
<div class="shrink-0">
<span class="inline-flex items-center px-2.5 py-1 rounded text-xs font-semibold bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300">
                        Medium
                    </span>
</div>
</div>
<!-- Task Item 3 -->
<div class="group flex items-center gap-4 bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm ring-1 ring-slate-900/5 dark:ring-white/10 transition-all hover:shadow-md">
<div class="flex size-6 shrink-0 items-center justify-center">
<input class="size-5 rounded border-slate-300 dark:border-slate-600 bg-transparent text-primary checked:bg-primary focus:ring-primary/20 dark:focus:ring-offset-slate-800 focus:ring-offset-0 cursor-pointer" type="checkbox"/>
</div>
<div class="flex flex-col flex-1 min-w-0">
<p class="text-slate-900 dark:text-white text-base font-semibold leading-snug truncate">Email Client</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium leading-normal mt-0.5">4:30 PM</p>
</div>
<div class="shrink-0">
<span class="inline-flex items-center px-2.5 py-1 rounded text-xs font-semibold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                        Low
                    </span>
</div>
</div>
<!-- Task Item 4 (Additional to fill space) -->
<div class="group flex items-center gap-4 bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm ring-1 ring-slate-900/5 dark:ring-white/10 transition-all hover:shadow-md opacity-60">
<div class="flex size-6 shrink-0 items-center justify-center">
<input checked="" class="size-5 rounded border-slate-300 dark:border-slate-600 bg-transparent text-primary checked:bg-primary focus:ring-primary/20 dark:focus:ring-offset-slate-800 focus:ring-offset-0 cursor-pointer" type="checkbox"/>
</div>
<div class="flex flex-col flex-1 min-w-0">
<p class="text-slate-900 dark:text-white text-base font-semibold leading-snug truncate line-through decoration-slate-400">Update Jira Tickets</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium leading-normal mt-0.5">9:00 AM</p>
</div>
<div class="shrink-0">
<span class="material-symbols-outlined text-green-500 text-lg">check_circle</span>
</div>
</div>
</div>
<!-- Floating Action Button -->
<button class="fixed bottom-24 right-5 z-20 flex size-14 items-center justify-center rounded-full bg-primary text-white shadow-lg shadow-primary/30 transition-transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
<span class="material-symbols-outlined" style="font-size: 32px;">add</span>
</button>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 z-10 w-full bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 pb-5 pt-2 px-6">
<div class="flex items-center justify-between">
<!-- Dashboard (Active) -->
<button class="group flex flex-col items-center gap-1 p-2 min-w-[64px] text-primary">
<span class="material-symbols-outlined filled" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="text-[10px] font-bold">Home</span>
</button>
<!-- Tasks -->
<button class="group flex flex-col items-center gap-1 p-2 min-w-[64px] text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
<span class="material-symbols-outlined">check_circle</span>
<span class="text-[10px] font-medium">Tasks</span>
</button>
<!-- Profile -->
<button class="group flex flex-col items-center gap-1 p-2 min-w-[64px] text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium">Profile</span>
</button>
<!-- Settings -->
<button class="group flex flex-col items-center gap-1 p-2 min-w-[64px] text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-medium">Settings</span>
</button>
</div>
</nav>
</div>
</body></html>
